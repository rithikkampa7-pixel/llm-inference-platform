global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/rules/*.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: llm-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8000"]
        labels:
          service: llm-gateway

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
